    <script>
      (function () {
        try {
          var stored = localStorage.getItem('ucp-theme');
          var dark = stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
    <title>Unity Control Protocol</title>
    <meta name="description" content="The Unity Editor as a command line. Scenes, objects, assets, play mode, tests, profiler, builds, screenshots and video from a terminal or an AI agent." />
